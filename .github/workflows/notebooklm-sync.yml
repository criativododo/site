name: NotebookLM Sync

on:
  push:
    branches:
      - main

jobs:
  notebooklm:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Gerar conhecimento do projeto
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const content = `# DODÔ APP WEB

Atualizado automaticamente em:
${new Date().toISOString()}

Commit:
${process.env.GITHUB_SHA}

Este arquivo será enriquecido nas próximas etapas automaticamente.
`;

            fs.mkdirSync('docs/notebooklm', { recursive: true });
            fs.writeFileSync('docs/notebooklm/PROJETO.md', content);

      - name: Commit automático
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/notebooklm/PROJETO.md

          if ! git diff --cached --quiet; then
            git commit -m "docs: update NotebookLM"
            git push
          fi
