# Nginx — Portal DODÔ (produção)
#
# Serve o build estático do portal-frontend e faz proxy_pass das rotas de API para o
# portal-backend (Express, atrás do PM2 em 127.0.0.1:4000).
#
# ATENÇÃO — SUBSTITUIR ANTES DE USAR:
#   SEU_DOMINIO_AQUI  → domínio real apontando para o IP da VPS (A record).
#                        Let's Encrypt/certbot NÃO emite certificado para IP nu — é
#                        obrigatório ter um domínio configurado antes do passo de HTTPS.
#
# Caminho de destino no servidor: /etc/nginx/sites-available/dodo-portal.conf
#   com symlink em /etc/nginx/sites-enabled/dodo-portal.conf
#
# Rodar `certbot --nginx -d SEU_DOMINIO_AQUI` DEPOIS deste arquivo estar ativo — o certbot
# reescreve este bloco automaticamente para adicionar os caminhos de certificado e o
# redirecionamento 80→443. As linhas de HTTPS abaixo já deixam a estrutura pronta para isso.

# ---- HTTP (porta 80) ----
server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO_AQUI;

    # Permite o desafio HTTP-01 do certbot antes de existir certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Até o certbot rodar e reescrever este bloco, serve normalmente em HTTP.
    # Após certbot --nginx, esta location vira um redirect 301 para HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS (porta 443) ----
# Descomentar e ajustar os caminhos de certificado após rodar certbot pela primeira vez
# (ou deixar o próprio certbot preencher automaticamente via --nginx).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SEU_DOMINIO_AQUI;

    # ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO_AQUI/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO_AQUI/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;

    # Reconciliado em 01/08/2026 (ver deploy/deploy.sh): raiz real da produção, alinhada ao
    # que o nginx já servia de fato — mudar aqui e no deploy.sh juntos se mudar de novo.
    root /var/www/portal-criativododo;
    index index.html;

    # API — proxy para o Express/PM2 local. Sem barra final em proxy_pass: preserva o
    # prefixo /api (app.ts monta `app.use("/api", apiRoutes)`, então o backend espera
    # receber /api/... por inteiro, não a rota "nua").
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Login/callback OIDC (ADR-007) — app.ts monta `app.use("/auth", authRoutes)`.
    location /auth/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check interno (usado por deploy/healthcheck.sh).
    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA — qualquer rota não resolvida cai no index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome (Vite) podem ser cacheados agressivamente.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
